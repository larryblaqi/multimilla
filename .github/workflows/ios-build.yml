name: Build Multimilla iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Node Dependencies
        run: |
          cd Archive
          npm install

      - name: Build Vue Production Web App & Sync Capacitor iOS
        run: |
          cd Archive
          npm run build
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd Archive/ios/App
          pod install

      - name: Build CocoaPods Dependencies
        run: |
          cd Archive/ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme Pods-App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || true

      - name: Build iOS Xcode App (Final Stage Before Signing)
        run: |
          cd Archive/ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_derived \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package Unsigned iOS IPA
        run: |
          cd Archive/ios/App
          APP_PATH=$(find build_derived -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App.app was not found in build_derived!"
            exit 1
          fi
          echo "Found built App bundle at: $APP_PATH"
          mkdir -p build_output/Payload
          cp -R "$APP_PATH" build_output/Payload/
          cd build_output
          zip -r multimilla-unsigned.ipa Payload
          cd ../../..
          mkdir -p lsapp/public/ios
          mkdir -p Archive/public/ios
          mkdir -p Archive/dist/ios
          cp Archive/ios/App/build_output/multimilla-unsigned.ipa lsapp/public/ios/multimilla-unsigned.ipa
          cp Archive/ios/App/build_output/multimilla-unsigned.ipa Archive/public/ios/multimilla-unsigned.ipa
          cp Archive/ios/App/build_output/multimilla-unsigned.ipa Archive/dist/ios/multimilla-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multimilla-ios-ipa
          path: Archive/public/ios/multimilla-unsigned.ipa

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multimilla-ios-app
          path: Archive/ios/App
