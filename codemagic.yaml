workflows:
  android-capacitor-app:
    name: Multimilla Android APK Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 18
      java: 17
    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Build Vue production web app & sync Capacitor Android
        script: |
          npm run build
          npx cap sync android

      - name: Build Android APK Package
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - dev@multimilla.com
        notify:
          success: true
          failure: true

  ios-capacitor-app:
    name: Multimilla iOS Application
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 18
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.multimilla.app"
    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Build Vue production web app & sync Capacitor
        script: |
          npm run build
          npx cap sync ios

      - name: CocoaPods installation
        script: |
          cd ios/App
          pod install

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA Package
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/App.ipa
      - "build/ios/ipa/*.ipa"
      - "*.ipa"

    publishing:
      email:
        recipients:
          - dev@multimilla.com
        notify:
          success: true
          failure: true
