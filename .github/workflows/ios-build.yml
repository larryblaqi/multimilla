name: Build Multimilla iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Node Dependencies
        run: |
          cd Archive
          npm install

      - name: Build Vue Production Web App & Sync Capacitor iOS
        run: |
          cd Archive
          npm run build
          npx cap sync ios

      - name: Install CocoaPods & Fix Script Permissions
        run: |
          cd Archive/ios/App
          pod install
          find Pods -name "*.sh" -exec chmod +x {} +

      - name: Build iOS Xcode App (Final Stage Before Signing)
        run: |
          cd Archive/ios/App
          set -o pipefail
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log

      - name: Package Unsigned iOS IPA
        run: |
          cd Archive/ios/App
          APP_PATH=$(find build_derived -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App.app was not created!"
            exit 1
          fi
          echo "Found built App bundle at: $APP_PATH"
          mkdir -p build_output/Payload
          cp -R "$APP_PATH" build_output/Payload/
          cd build_output
          zip -r multimilla-unsigned.ipa Payload
          
          mkdir -p "$GITHUB_WORKSPACE/lsapp/public/ios"
          mkdir -p "$GITHUB_WORKSPACE/Archive/public/ios"
          mkdir -p "$GITHUB_WORKSPACE/Archive/dist/ios"
          cp multimilla-unsigned.ipa "$GITHUB_WORKSPACE/lsapp/public/ios/multimilla-unsigned.ipa"
          cp multimilla-unsigned.ipa "$GITHUB_WORKSPACE/Archive/public/ios/multimilla-unsigned.ipa"
          cp multimilla-unsigned.ipa "$GITHUB_WORKSPACE/Archive/dist/ios/multimilla-unsigned.ipa"

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multimilla-ios-build-log
          path: Archive/ios/App/xcodebuild.log

      - name: Upload Unsigned IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: multimilla-ios-ipa
          path: Archive/public/ios/multimilla-unsigned.ipa

      - name: Upload iOS Xcode Project Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: multimilla-ios-app
          path: Archive/ios/App

      - name: Create or Update GitHub Release v1.5.3
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.3
          target_commitish: main
          name: multimilla Mobile v1.5.3 — iOS Status Bar Header Spacing & Safe Area Fix
          body: |
            ## multimilla v1.5.3 — iOS Status Bar Header Spacing & Safe Area Fix

            ### Fixes & Improvements on iOS:
            1. **Shifted Page Content Below Status Bar**:
               - All page headers, back buttons, and titles across Transaction Details, Transaction History, Cards & Virtual Pay, Loans, and other pages now have guaranteed minimum `44px` clearance (`max(44px, env(safe-area-inset-top))`).
               - The top banner and back buttons are positioned clearly below the status bar clock, network icons, and battery indicator so they are completely unobstructed, visible, and easy to tap.
            2. **Enhanced WKWebView Inset Handling**:
               - Restored automatic content inset adjustments on iOS so the native status bar space and `env(safe-area-inset-top)` are correctly respected.
            3. **Live Chat Safe Offset**:
               - Configured Smartsupp live chat modal positioning to avoid status bar overlap.

            ### Direct Download (No Sign-in Required):
            - **[multimilla-unsigned.ipa](https://github.com/larryblaqi/multimilla/releases/download/v1.5.3/multimilla-unsigned.ipa)** — iOS Unsigned App
          files: Archive/public/ios/multimilla-unsigned.ipa
