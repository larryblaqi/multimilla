name: Build Multimilla Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node Dependencies
        run: |
          cd Archive
          npm install

      - name: Build Vue Production Web App
        run: |
          cd Archive
          npm run build

      - name: Sync Capacitor Android Assets
        run: |
          cd Archive
          npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x Archive/android/gradlew

      - name: Build Android APK Package
        run: |
          cd Archive/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: multimilla-android-app
          path: Archive/android/app/build/outputs/apk/debug/app-debug.apk
